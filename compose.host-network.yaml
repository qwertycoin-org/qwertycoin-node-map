services:
  node-map:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwertycoin-node-map:local
    env_file: .env.host
    network_mode: host
    volumes:
      - node-map-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128

volumes:
  node-map-data:
