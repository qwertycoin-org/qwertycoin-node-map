services:
  node-map:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwertycoin-node-map:local
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_HTTP_PORT:-18082}:8080"
    volumes:
      - node-map-data:/data
    networks:
      - qwc-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  node-map-data:

networks:
  qwc-backend:
    external: true
    name: ${QWC_DOCKER_NETWORK}
